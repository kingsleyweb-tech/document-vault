# Builds the desktop installers on each operating system. A Mac build can only
# be made on a Mac, and a Linux build is best made on Linux, so each runs on its
# own machine.
#
# - Run by hand (Actions tab, "Run workflow"): builds everything and keeps the
#   results as downloadable artifacts. Nothing is published.
# - Push a version tag (git tag v1.2.3 && git push origin v1.2.3): also
#   publishes a GitHub release with the Windows and Mac installers and
#   SHA256SUMS.txt. The tag must match "version" in desktop/package.json.
#   Linux is built but not attached until it has been tested.
#
# Repository secret needed (Settings, Secrets and variables, Actions): DOC,
# holding the website's .env lines (at least the VITE_ ones). The VITE_ values
# end up in the app like they do on the website, but stay out of the repository.

name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            script: dist:win
            files: |
              desktop/release/*.exe
          # One Mac builds both: arm64 for Apple Silicon and x64 for Intel.
          - os: macos-latest
            name: macos
            script: dist:mac
            files: |
              desktop/release/*.dmg
          - os: ubuntu-latest
            name: linux
            script: dist:linux
            files: |
              desktop/release/*.AppImage
              desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificates yet; see docs/PRODUCT_PLAN.md (A3, A4).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      # The settings come from the DOC secret (a copy of the website's .env)
      # or from one secret per VITE_ name. They are written to a .env file on
      # this build machine only; Vite puts only the VITE_ values into the app.
      - name: Write the build settings
        shell: bash
        env:
          DOC: ${{ secrets.DOC }}
          SECRET_VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          SECRET_VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          SECRET_VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          SECRET_VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          SECRET_VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          SECRET_VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          SECRET_VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          SECRET_VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          : > .env
          if [ -n "$DOC" ]; then printf '%s\n' "$DOC" | tr -d '\r' >> .env; fi
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_FIREBASE_MEASUREMENT_ID VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            value_name="SECRET_$name"
            if [ -n "${!value_name}" ]; then echo "$name=${!value_name}" >> .env; fi
          done
          missing=0
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if ! grep -qE "^[[:space:]]*$name[[:space:]]*=[[:space:]]*[^[:space:]]" .env; then echo "::error::$name is missing from the DOC secret"; missing=1; fi
          done
          exit $missing
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run ${{ matrix.script }}
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    # Runs for version tags once Windows and Mac have built, even if Linux failed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match desktop/package.json version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: files
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: files
      - name: Write checksums
        working-directory: files
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            jq -r '.notes[] | "- " + .' public/releases/latest.json
            echo
            echo "Pick the right file for your computer on the Downloads page. The installers are not yet signed with paid certificates, so Windows and macOS ask you to confirm the first time you open them; the Downloads page explains how."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Document Vault ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
